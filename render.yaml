# Render Blueprint — deploys RavenShield as a free static site.
# Render dashboard: New + > Blueprint > select this repo.
services:
  - type: web
    name: ravenshield
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://api.pwnedpasswords.com https: http:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
      - path: /sw.js
        name: Cache-Control
        value: no-cache
